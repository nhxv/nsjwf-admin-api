# - Separate logs for postgres and backend

name: nsjwf

services:
  postgresql:
    image: postgres:16
    container_name: "pg16"
    ports:
      # HostPort:ContainerPort
      # ContainerPort is used between containers, HostPort is used between host and container.
      - "9000:5432"
    environment:
      POSTGRES_USER: "mike"
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: "mydb"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      target: dev # if use "prod", don't use --watch flag when using docker compose up
    ports:
      # HostPort:ContainerPort
      - "8000:8000"
    volumes:
      - uploads:/usr/local/app/uploads
    develop:
      watch:
        - action: sync
          path: ./src
          target: /usr/local/app/backend/src
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

volumes:
  db-data:
    external: true
    name: "nsjwf-pg"
  uploads:
    external: true
    name: "nsjwf-uploads"
